[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-hand-model"
version = "0.1.0"
description = "Standalone 21-landmark hand-pose inference with OpenCV DNN"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yash Thakur" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
open-hand-model = "open_hand_model.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
